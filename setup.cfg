[metadata]
name = wizardry-parity
version = 0.1.0
description = Evidence-first Wizardry capability parity and remote routing
license = MIT

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
include_package_data = True

[options.packages.find]
where = src

[options.package_data]
parity =
    data/*.json
    schemas/*.json

[options.entry_points]
console_scripts =
    parity = parity.cli:main
